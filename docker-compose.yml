services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: two-tier-devsecops-app:day3
    container_name: two-tier-devsecops-app
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      FLASK_DEBUG: "false"
    ports:
      - "5000:5000"
    restart: unless-stopped
