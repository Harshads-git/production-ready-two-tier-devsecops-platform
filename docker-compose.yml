services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: two-tier-devsecops-app:day7
    container_name: two-tier-devsecops-app
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      FLASK_DEBUG: "false"
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-appdb}
      DATABASE_USER: ${DATABASE_USER:-appuser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me-locally}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: two-tier-devsecops-db
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-appdb}
      MYSQL_USER: ${DATABASE_USER:-appuser}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-change-me-locally}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-change-root-locally}
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
